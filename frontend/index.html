<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Pro</title>

  <!-- FOUC 방지: CDN 로드 전 테마 클래스 적용 -->
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if ((saved ?? preferred) === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>

<body class="font-sans bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors duration-200">

  <!-- ── 헤더 ──────────────────────────────────── -->
  <header class="sticky top-0 z-10 bg-white/80 dark:bg-gray-900/80 backdrop-blur-sm border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
      <h1 class="text-lg font-semibold text-gray-900 dark:text-white">TaskFlow Pro</h1>
      <button id="themeToggle"
              class="min-w-[44px] min-h-[44px] flex items-center justify-center rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
              aria-label="테마 전환">
        <span id="themeIcon" class="text-xl"></span>
      </button>
    </div>
  </header>

  <!-- ── 메인 ──────────────────────────────────── -->
  <main class="max-w-2xl mx-auto px-4 py-6 space-y-6">

    <!-- 추가 폼 -->
    <section class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-5">
      <h2 class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-4">새 태스크</h2>
      <form id="addForm" novalidate>
        <div class="space-y-3">
          <input id="titleInput" type="text" placeholder="태스크 제목을 입력하세요"
                 class="w-full rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400 min-h-[44px]">
          <div class="flex flex-wrap gap-2">
            <input id="dueInput" type="datetime-local"
                   class="flex-1 min-w-[180px] rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 min-h-[44px]">
            <select id="statusSelect"
                    class="rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 min-h-[44px]">
              <option value="todo">예정</option>
              <option value="in_progress">진행중</option>
              <option value="done">완료</option>
            </select>
            <button type="submit"
                    class="flex-1 sm:flex-none min-h-[44px] px-6 rounded-xl bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-medium text-sm transition-colors">
              + 추가
            </button>
          </div>
          <p id="formError" class="hidden text-red-500 text-xs"></p>
        </div>
      </form>
    </section>

    <!-- 태스크 목록 -->
    <section>
      <h2 class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-3">태스크 목록</h2>
      <div id="taskList" class="space-y-3"></div>
    </section>

  </main>

  <!-- ── 수정 모달 ──────────────────────────────── -->
  <div id="editModal"
       class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm px-4"
       data-task-id="">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md p-6 space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-base font-semibold text-gray-900 dark:text-white">태스크 수정</h3>
          <p id="modalMeta" class="text-xs text-gray-400 dark:text-gray-500 mt-0.5"></p>
        </div>
        <button id="modalCloseBtn"
                class="min-w-[44px] min-h-[44px] flex items-center justify-center rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-400 transition-colors text-lg"
                aria-label="닫기">✕</button>
      </div>
      <div class="space-y-3">
        <input id="modalTitle" type="text" placeholder="제목"
               class="w-full rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 min-h-[44px]">
        <textarea id="modalDescription" placeholder="설명 (선택)" rows="3"
                  class="w-full rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
        <input id="modalDue" type="datetime-local"
               class="w-full rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 min-h-[44px]">
        <select id="modalStatus"
                class="w-full rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 min-h-[44px]">
          <option value="todo">예정</option>
          <option value="in_progress">진행중</option>
          <option value="done">완료</option>
        </select>
        <p id="modalError" class="hidden text-red-500 text-xs"></p>
      </div>
      <div class="flex gap-3 pt-2">
        <button id="modalCancelBtn"
                class="flex-1 min-h-[44px] rounded-xl border border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-300 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
          취소
        </button>
        <button id="modalSaveBtn"
                class="flex-1 min-h-[44px] rounded-xl bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium transition-colors">
          저장
        </button>
      </div>
    </div>
  </div>

  <!-- ── 삭제 확인 모달 ────────────────────────── -->
  <div id="deleteModal"
       class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm px-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-sm p-6 space-y-4">
      <h3 class="text-base font-semibold text-gray-900 dark:text-white">태스크 삭제</h3>
      <p class="text-sm text-gray-600 dark:text-gray-400">정말 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.</p>
      <div class="flex gap-3">
        <button id="deleteCancelBtn"
                class="flex-1 min-h-[44px] rounded-xl border border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-300 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
          취소
        </button>
        <button id="deleteConfirmBtn"
                class="flex-1 min-h-[44px] rounded-xl bg-red-500 hover:bg-red-600 text-white text-sm font-medium transition-colors">
          삭제
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
